<svg xmlns="http://www.w3.org/2000/svg" width="495" height="230" viewBox="0 0 495 230" role="img" aria-label="GitHub activity">
<title>GitHub activity</title>
<style>
  .t { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #EEF2FA; }
  .m { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8D97AC; }
  .mono { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .rise { animation: rise .6s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: left; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
  .pulse { animation: pulse 2.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .rise, .grow, .pulse { animation: none; } }
</style>
<rect x="0.5" y="0.5" width="494" height="229" rx="18" fill="#080C16" stroke="#18223A"/>
<text x="28" y="42" class="t" font-size="16" font-weight="700">Activity</text>
<text x="467" y="42" text-anchor="end" class="m mono" font-size="11">updated 21 Nov 2026</text>
