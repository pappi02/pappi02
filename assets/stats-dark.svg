<g class="rise" style="animation-delay:0.08s"><rect x="254" y="62" width="212" height="66" rx="12" fill="#030407" stroke="#18223A"/><rect x="268" y="78" width="3" height="34" rx="1.5" fill="#1558C9"/><text x="282" y="91" class="m" font-size="12">Commits</text><text x="282" y="114" class="t" font-size="22" font-weight="800">519</text><text x="452" y="114" text-anchor="end" class="m" font-size="11">last 12 months</text></g>
<g class="rise" style="animation-delay:0.16s"><rect x="28" y="140" width="212" height="66" rx="12" fill="#030407" stroke="#18223A"/><rect x="42" y="156" width="3" height="34" rx="1.5" fill="#D4FF24"/><text x="56" y="169" class="m" font-size="12">Current streak</text><text x="56" y="192" class="t" font-size="22" font-weight="800">5</text><text x="226" y="192" text-anchor="end" class="m" font-size="11">longest 7 days</text></g>
