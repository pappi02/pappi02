name: Profile dashboard

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 06:00 Nairobi
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/dashboard.yml"]

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build dashboard cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/build_dashboard.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Refresh dashboard cards"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#D4FF24&color_dots=#0d1117,#0c2a5c,#1558C9,#4f86e8,#D4FF24
            dist/snake-light.svg?color_snake=#1558C9&color_dots=#ebedf0,#c6d8f7,#7fa6eb,#3a74db,#1558C9
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
